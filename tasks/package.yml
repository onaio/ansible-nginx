---
- name: Run the equivalent of "apt-get update" as a separate step
  apt:
    update_cache: yes

- name: Nginx | Make sure the ansible required dependencies are installed
  apt:
    name:
      - python3-pycurl
      - dirmngr
      - gnupg
      - wget
    state: present

- name: Nginx | Ensure the apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Nginx | Add the nginx.org signing key
  get_url:
    url: https://nginx.org/keys/nginx_signing.key
    dest: /etc/apt/keyrings/nginx.asc
    mode: "0644"

- name: Add Nginx APT repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nginx.asc] https://nginx.org/packages/ubuntu/ {{ ubuntu_release }} nginx"
    state: present

- name: Update apt cache
  apt:
    update_cache: yes

- name: Nginx | Make sure nginx is installed (package)
  apt:
    pkg: "{{nginx}}"
    state: present
  notify:
    - restart nginx

- name: Nginx | Make sure the NGINX service is enabled
  service:
    name: nginx
    enabled: true

- include_tasks: directories.yml
